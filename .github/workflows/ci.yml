name: CI
on: 
  push:
  pull_request:
jobs: 
  tests:
      runs-on: ubuntu-latest
      steps:
          - name: Check out the repository
            uses: actions/checkout@v4
          - name: Set up Node
            uses: actions/checkout@v4
            with:
              node_version: 22
          - name: Install the Bruno CLI
            run: npm install -g @usebruno/cli@4.3.0
